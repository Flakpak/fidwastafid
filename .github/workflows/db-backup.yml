# .github/workflows/db-backup.yml
#
# Phase 0 — Protéger l'existant : backup quotidien de la base de production.
#
# Ce workflow :
#   1. Dumpe la base prod (pg_dump plain, portable — aucune dépendance Supabase-only).
#   2. Vérifie que le dump est complet (marqueur de fin) et non vide.
#   3. RESTAURE le dump dans un Postgres jetable et ÉCHOUE si les données ne reviennent pas.
#      → « Un backup non testé n'existe pas. »
#   4. Compresse et stocke le backup HORS Supabase :
#         - toujours : artefact GitHub (protection immédiate, rétention 30 j) ;
#         - si secrets R2 configurés : Cloudflare R2 (durable, S3-compatible → portable).
#   5. En cas d'échec (n'importe quelle étape) : OUVRE UNE ISSUE GitHub — un run de
#      cron n'envoie d'e-mail à personne. Voir l'étape « Alerte » en fin de fichier.
#      Le chemin d'alerte s'éprouve à la main : Run workflow → simuler_echec.
#
# SECRETS À CONFIGURER (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL   (obligatoire) chaîne du SESSION POOLER (IPv4), format :
#     postgresql://postgres.<ref>:<motdepasse>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   R2_ACCOUNT_ID     (optionnel) id de compte Cloudflare
#   R2_BUCKET         (optionnel) nom du bucket R2
#   R2_ACCESS_KEY_ID  (optionnel) clé d'accès R2
#   R2_SECRET_ACCESS_KEY (optionnel)
#
# Tant que les secrets R2 ne sont pas mis, le backup part quand même en artefact GitHub :
# tu es protégé dès le premier run, R2 peut venir juste après.

name: Backup base de données (pg_dump quotidien)

on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC chaque jour (~04:00 heure du Maroc)
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main
    inputs:
      simuler_echec:
        description: "Éprouver le chemin d'alerte : fait échouer le run exprès, SANS toucher à la base"
        type: boolean
        default: false
      seuil_heures:
        description: "Seuil de fraîcheur du pipeline, en heures (30 par défaut). Mettre 0 pour éprouver l'alerte d'absence d'exécution."
        type: string
        required: false

concurrency:
  group: db-backup
  cancel-in-progress: false   # ne jamais couper un backup en cours

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `issues: write` pour la seule étape d'alerte ci-dessous (le réglage par
    # défaut du dépôt est en lecture seule). Aucune autre écriture demandée :
    # ce workflow ne pousse rien, ne déploie rien.
    permissions:
      contents: read
      issues: write

    # Postgres jetable qui sert UNIQUEMENT au test de restauration.
    services:
      restore_target:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      DUMP_FILE: fidwastafid_${{ github.run_id }}.sql
      # Remontés au niveau job pour pouvoir les tester dans les `if:` d'étape.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      # Nécessaire pour `uses: ./.github/actions/alerte-issue` (action locale) :
      # sans checkout, le runner n'a pas le fichier d'action sur disque.
      - uses: actions/checkout@v7

      # Éprouve le chemin d'alerte sans toucher à la base — « un filet non
      # testé n'existe pas », même règle que le test de restauration plus bas.
      # Uniquement joignable par workflow_dispatch : sur le cron, `inputs` est
      # nul, la condition est fausse, l'étape est sautée.
      - name: Échec simulé (test du chemin d'alerte)
        if: ${{ inputs.simuler_echec }}
        run: |
          echo "::error::Échec simulé — test du chemin d'alerte. La base n'a pas été touchée."
          exit 1

      - name: Installer pg_dump 17 (dépôt officiel PGDG)
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Le runner a un pg_dump 16 préinstallé qui gagne dans le PATH. On place les
          # binaires 17 en tête du PATH pour TOUTES les étapes suivantes (serveur = PG 17).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          # Vérif immédiate via le chemin complet (GITHUB_PATH ne s'applique qu'aux étapes suivantes).
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump de la base de production
        env:
          PGCONNECT_TIMEOUT: '30'
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # --no-owner / --no-privileges : dump portable, restaurable dans n'importe quel
          # Postgres (VPS futur inclus) sans dépendre des rôles Supabase. Cohérent avec
          # la porte de sortie "la base sort par pg_dump".
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --format=plain \
            --file="$DUMP_FILE"

          echo "Taille du dump : $(du -h "$DUMP_FILE" | cut -f1)"

          # Intégrité 1/2 : fichier non vide.
          test -s "$DUMP_FILE"

          # Intégrité 2/2 : pg_dump écrit ce marqueur en toute fin. S'il est absent,
          # le dump a été coupé (réseau, timeout) → on refuse ce backup.
          if ! grep -q "PostgreSQL database dump complete" "$DUMP_FILE"; then
            echo "::error::Dump tronqué : marqueur de fin absent."
            exit 1
          fi

      - name: Test de restauration (le vrai garde-fou)
        env:
          PGPASSWORD: testpass
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: restore_test
        run: |
          set -euo pipefail

          # On restaure SANS ON_ERROR_STOP : un dump Supabase contient des références à
          # des rôles/extensions internes (auth, storage, graphql…) absents d'un Postgres
          # nu. Ces erreurs sont attendues et sans conséquence sur les données métier.
          # Le vrai test = l'assertion ci-dessous sur les tables réellement restaurées.
          psql -f "$DUMP_FILE" > restore.log 2>&1 || true

          # Assertion dure : au moins une table métier restaurée dans le schéma public.
          TABLES=$(psql -tAc \
            "select count(*) from information_schema.tables
             where table_schema='public' and table_type='BASE TABLE';")
          echo "Tables restaurées dans public : $TABLES"
          if [ "${TABLES:-0}" -lt 1 ]; then
            echo "::error::Aucune table métier restaurée — backup inexploitable."
            echo '----- extrait du log de restauration -----'
            tail -n 40 restore.log || true
            exit 1
          fi

          # Log lisible (visible dans l'onglet du run) : lignes par table.
          echo '----- Contenu restauré -----'
          psql -c "select relname as table, n_live_tup as lignes
                   from pg_stat_user_tables order by n_live_tup desc;"

      - name: Compresser le backup validé
        run: |
          set -euo pipefail
          gzip -9 "$DUMP_FILE"
          echo "STAMP=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"

      # Protection immédiate : marche sans aucune config supplémentaire.
      - name: Archiver en artefact GitHub (hors Supabase)
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ env.STAMP }}
          path: ${{ env.DUMP_FILE }}.gz
          retention-days: 30

      # Stockage durable : ne s'exécute que si les secrets R2 sont présents.
      - name: Envoyer vers Cloudflare R2 (durable)
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          KEY="fidwastafid/${STAMP}.sql.gz"
          aws s3 cp "${DUMP_FILE}.gz" "s3://${R2_BUCKET}/${KEY}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Backup durable : s3://${R2_BUCKET}/${KEY}"

      # ------------------------------------------------------------------
      # ALERTE — fait générateur du 27/07/2026.
      #
      # Le mot de passe de la base a été tourné dans la nuit ; le secret
      # SUPABASE_DB_URL est resté sur l'ancienne valeur. Ce workflow a donc
      # échoué (28P01) et PERSONNE ne l'a su : découvert le lendemain matin par
      # un audit manuel, après une journée sans backup vérifié. GitHub n'envoie
      # d'e-mail d'échec qu'à l'auteur du commit déclencheur — un run de cron
      # n'en a pas.
      #
      # > Un filet de sécurité qui tombe sans bruit n'est pas un filet.
      #
      # Mécanique d'ouverture/dédoublonnage factorisée dans
      # .github/actions/alerte-issue (partagée avec le pipeline quotidien).
      # ------------------------------------------------------------------
      - name: Alerte — échec du backup
        if: failure()
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-backup
          depot: ${{ github.repository }}
          # Assignation + label `urgent` : c'est l'assignation qui déclenche la
          # notification GitHub par défaut du destinataire. Sans elle, l'issue
          # existe mais personne n'est prévenu — le défaut exact du 27/07/2026,
          # où l'échec a été découvert le lendemain par un audit manuel.
          # Aucune dépendance nouvelle : même action locale que le pipeline.
          assignes: Flakpak
          labels-supplementaires: urgent
          titre: "Backup de la base en échec"
          corps: |
            Le workflow **Backup base de données (pg_dump quotidien)** a **échoué**.

            | | |
            |---|---|
            | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Déclencheur | `${{ github.event_name }}` |

            **Tant que cette issue est ouverte, la production n'a pas de backup vérifié du jour.**

            Cause la plus fréquente, constatée le 27/07/2026 : le secret `SUPABASE_DB_URL`
            ne correspond plus au mot de passe de la base (rotation appliquée ailleurs mais
            pas ici) — l'erreur du run est alors `password authentication failed`.
            Liste des détenteurs du mot de passe et ordre de mise à jour :
            `docs/RUNBOOK-securite.md`, section « Rotation du mot de passe de la base ».

  # ----------------------------------------------------------------------
  # SURVEILLANCE CROISÉE — le cas « aucune exécution ».
  #
  # L'alerte d'échec ci-dessus ne couvre que « le run a échoué ». Le 27/07/2026,
  # le pipeline quotidien n'a pas tourné du tout pendant plus de trois heures
  # après sa fenêtre habituelle : rien à observer, donc rien à alerter — c'est
  # le cas qui nous a échappé.
  #
  # Choix : chaque workflow quotidien vérifie la FRAÎCHEUR DE L'AUTRE. Aucun
  # workflow de surveillance supplémentaire (il faudrait le surveiller à son
  # tour : un cron qui se surveille lui-même ne détecte pas son propre
  # silence), et aucune sentinelle en base (elle exige un lecteur qui tourne,
  # c'est-à-dire un cron de plus). Pour que le silence passe inaperçu, il
  # faudrait que les DEUX crons cessent le même jour — cas résiduel assumé,
  # documenté dans docs/RUNBOOK-securite.md (GitHub désactive un workflow
  # planifié après 60 jours d'inactivité du dépôt).
  # ----------------------------------------------------------------------
  surveillance-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Fraîcheur du dernier succès du pipeline quotidien
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          # 30 h = un jour + marge pour la dérive de planification observée chez
          # GitHub (jusqu'à ~3 h 30 de retard sur l'heure du cron).
          SEUIL_HEURES: ${{ inputs.seuil_heures || 30 }}
        run: |
          set -euo pipefail

          DERNIER=$(gh run list -R "$DEPOT" --workflow pipeline-quotidien.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')

          if [ -z "$DERNIER" ]; then
            echo "alerte=oui" >> "$GITHUB_OUTPUT"
            echo "detail=aucun run réussi trouvé dans l'historique consultable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$(( ( $(date -u +%s) - $(date -u -d "$DERNIER" +%s) ) / 3600 ))
          echo "Dernier succès du pipeline : $DERNIER (il y a ${AGE} h, seuil ${SEUIL_HEURES} h)"

          if [ "$AGE" -gt "$SEUIL_HEURES" ]; then
            echo "alerte=oui" >> "$GITHUB_OUTPUT"
            echo "detail=dernier succès il y a ${AGE} h (seuil ${SEUIL_HEURES} h), le ${DERNIER}" >> "$GITHUB_OUTPUT"
          else
            echo "alerte=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Alerte — le pipeline quotidien ne tourne plus
        if: steps.fraicheur.outputs.alerte == 'oui'
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-pipeline
          depot: ${{ github.repository }}
          titre: "Pipeline quotidien : aucune exécution récente"
          corps: |
            Le workflow **Pipeline quotidien** n'a **pas tourné** dans la fenêtre attendue.

            | | |
            |---|---|
            | Constat | ${{ steps.fraicheur.outputs.detail }} |
            | Vu depuis | run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) du backup |

            Ce cas-là ne produit aucun échec à observer : c'est une **absence**. Il est
            détecté par surveillance croisée — le backup vérifie la fraîcheur du pipeline,
            le pipeline celle du backup.

            À vérifier dans l'ordre : le workflow est-il encore `active`
            (GitHub désactive un workflow planifié après 60 jours d'inactivité du dépôt) ?
            Le cron a-t-il été supprimé ou modifié ? Les runs échouent-ils avant d'écrire
            quoi que ce soit ?
