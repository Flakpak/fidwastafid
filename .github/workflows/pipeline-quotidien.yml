# .github/workflows/pipeline-quotidien.yml
#
# Phase 7B — cron quotidien : purge du stock mort (expiration auto_draft)
# -> scraping Bringo -> insertion (validation zod partagée, packages/schemas)
# -> scraping inwi -> insertion (source secondaire isolée, lot du 23/07/2026)
# -> scraping universparadiscount -> insertion (source secondaire isolée,
#    lot du 23/07/2026) -> ... -> revalidation Next.js (feed, enseignes,
#    sitemap).
#
# Automatisé uniquement : scraper-bringo (categories.txt auto-suffisant),
# scraper-inwi (page unique auto-suffisante), scraper-universparadiscount
# (homepage auto-suffisante), scraper-kiabi (products.json Shopify,
# pagination bornée + cap de 120 deals/run), scraper-carrefour (API JSON,
# pagination bornée, EN PARALLÈLE de bringo — docs/SPIKE-SOURCES.md §10-12,
# ajouté au cron le 14/08/2026, PR de wiring, jusque-là construit mais jamais
# appelé automatiquement), scraper-ab-maroc et scraper-aswakassalam (Store
# API WooCommerce, pagination bornée, ajoutés le 14/08/2026 —
# docs/SPIKE-SOURCES.md §9, recontrôle du même jour), scraper-lemobilier
# (page promo PrestaShop, pas de plafond posé — le total réel est lu puis
# récupéré en une seule requête, docs/SPIKE-SOURCES.md, recontrôle du
# 14/08/2026, ajouté au cron le 15/08/2026) + insert-deals (qui fait
# lui-même l'extraction de description via fiche-produit.mjs, cf. README).
# PAS extract-catalogue : ce script attend une URL/chemin de catalogue précis
# à chaque appel (aucun mécanisme de découverte automatique) — il ne peut pas
# tourner sans surveillance, il reste un geste manuel ponctuel.
#
# scraper-bestmark RETIRÉ du cron le 13/08/2026, scraper-decathlon RETIRÉ le
# 15/08/2026 — voir docs/IDEES.md, section « Decathlon retiré (cause
# indéterminée), ab-maroc conservé ». Decathlon : challenge Cloudflare confirmé par
# diagnostic dédié (cf-mitigated: challenge, rejet quasi instantané), cause
# exacte du déclenchement — empreinte TLS ou catégorie d'IP — INDÉTERMINÉE,
# un runner auto-hébergé n'a pas été construit pour autant (changer d'IP ne
# réparerait pas nécessairement une cause TLS). scraper-ab-maroc RETIRÉ
# BRIÈVEMENT le même jour puis RÉINTÉGRÉ (voir sa note dédiée plus bas) :
# son échec du 15/08 était un incident isolé (`fetch failed`, jamais
# reproduit), pas une série — le mécanisme de séries d'échecs consécutifs
# (verification-sources ci-dessous) est le bon outil pour ce cas, pas un
# retrait sur un seul run. Les deux scripts retirés (bestmark, decathlon)
# restent dans le dépôt, exécutables à la main, simplement plus appelés
# automatiquement.
#
# Pas de continue-on-error sur la chaîne PRINCIPALE (expiration -> Bringo ->
# insertion -> revalidation) : un échec y fait échouer le job franchement —
# GitHub notifie par email, suffisant à cette échelle (pas d'astreinte).
# EXCEPTION documentée (lots inwi + universparadiscount + decathlon,
# 23/07/2026) : les étapes de ces sources SECONDAIRES portent
# continue-on-error — leur échec ne doit jamais faire échouer le travail
# Bringo déjà accompli, ni les unes des autres, ni bloquer la revalidation.
# Contrepartie assumée : un échec d'une source secondaire ne déclenche PAS
# d'email (job vert) — il se signale par une annotation ::warning:: sur la
# page du run.
#
# SUPERVISION (lot du 12/08/2026, migration 0020, table pipeline_runs) — le
# contrôle ci-dessus ne teste qu'un FICHIER produit par le scraper, jamais
# l'INSERTION nette en base : il ne distinguait pas une source injoignable
# (panne technique) d'une source sans rien d'assez remisé (état de marché)
# ou d'une source dont tout est déjà en base (catalogue figé). Chaque étape
# de scraping/insertion écrit maintenant sa cause dans pipeline_runs (via
# insert-deals.mjs ou enregistrer-echec-scraping.mjs selon le cas), et le job
# verification-sources détecte les séries de runs consécutifs en échec par
# cause (seuils différents — voir apps/pipeline/verifier-sources-mortes.mjs),
# escaladées par le job alerte-sources via .github/actions/alerte-issue (même
# mécanisme que l'alerte pipeline/backup ci-dessous, un label par source).
#
# Corrigé dans le même lot : `run:` sous bash s'exécute avec `-e` par défaut
# (GitHub Actions) — `sortie=$(pnpm ... | tee /dev/stderr)` qui échoue tuait
# le script AVANT les branches `if [ -z "$fichier_relatif" ]` etc., qui
# auraient pourtant donné le bon diagnostic. `&& code=0 || code=$?` sur cette
# ligne (jamais un `|| true` seul — trop large, il avalerait TOUT échec du
# scraper, pas seulement le crash avant écriture) capture le code réel sans
# tuer le script, sur les six étapes de scraping. Un DEUXIÈME cas est vérifié
# juste après, avec ce code : un fichier annoncé mais un processus qui
# termine quand même en erreur (bug sans rapport avec le réseau, survenu
# après l'écriture) est traité comme un échec, jamais comme un run propre.

name: Pipeline quotidien

on:
  schedule:
    # 05:00 UTC = 06:00 Casablanca (WET toute l'année, le Maroc n'observe
    # pas le changement d'heure d'été/hiver comme l'Europe).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      simuler_echec:
        description: "Éprouver le chemin d'alerte : fait échouer le run exprès, AVANT tout scraping ou écriture en base"
        type: boolean
        default: false
      seuil_heures:
        description: "Seuil de fraîcheur du backup, en heures (30 par défaut). Mettre 0 pour éprouver l'alerte d'absence d'exécution."
        type: string
        required: false

concurrency:
  # File d'attente, jamais d'annulation brutale : interrompre un run en
  # pleine insertion (écritures individuelles, pas une transaction globale,
  # cf. apps/pipeline/insert-deals.mjs) ne corromprait rien, mais autant
  # laisser un run se terminer proprement plutôt que le tuer à mi-chemin.
  group: pipeline-quotidien
  cancel-in-progress: false

env:
  # SUPABASE_DB_URL (secret GitHub) -> DATABASE_URL (nom attendu par
  # apps/pipeline, packages/db) : mapping explicite, les deux noms ne sont
  # pas censés coïncider.
  DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Pas de CLAUDE_MODEL : le pipeline utilise sa valeur par défaut (non
  # utilisé par ce workflow de toute façon, extract-catalogue n'est pas
  # automatisé — cf. note en tête de fichier).

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `issues: write` pour la seule étape d'alerte en fin de job (le réglage
    # par défaut du dépôt est en lecture seule).
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # Éprouve le chemin d'alerte SANS scraper ni écrire en base : première
      # étape, avant toute installation. Uniquement joignable par
      # workflow_dispatch — sur le cron, `inputs` est nul, l'étape est sautée.
      - name: Échec simulé (test du chemin d'alerte)
        if: ${{ inputs.simuler_echec }}
        run: |
          echo "::error::Échec simulé — test du chemin d'alerte. Aucun scraping, aucune écriture."
          exit 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Expiration des deals auto_draft (> 14 jours)
        run: pnpm --filter pipeline run expirer-auto-draft

      # Incident du 20/07/2026 : `pnpm --filter pipeline run <script> -- <args>`
      # transmet le "--" LITTÉRALEMENT au script sous-jacent (constaté
      # empiriquement) — argv[2] devenait "--" au lieu du premier argument
      # réel, d'où "ENOENT: open '--'" côté insert-deals.mjs. Plus aucun "--"
      # dans ce fichier, sur aucune étape.
      #
      # Passage explicite du fichier produit (au lieu de deviner via `find`) :
      # cette étape capture la ligne "→ Archive : <chemin>" déjà loguée par
      # scraper-bringo.mjs (code du scraper inchangé), vérifie que le fichier
      # existe réellement, compte les deals qu'il contient (log de synthèse)
      # et échoue EXPLICITEMENT si ce compte est 0 — un run qui n'a rien
      # scrapé doit être rouge, jamais rattrapé silencieusement par un
      # fichier vide ou périmé.
      #
      # `&& code=0 || code=$?` sur `sortie=$(...)` : sans lui, bash (-e par
      # défaut sous GitHub Actions) tue le script exactement à cette ligne si
      # le scraper échoue (crash réseau) — AVANT que les branches ci-dessous
      # n'aient la chance de distinguer "aucun fichier" de "fichier vide".
      # Constaté sur bestmark (fetch failed, 10 runs) : le job restait vert
      # malgré continue-on-error, sans qu'aucune des trois annotations
      # n'apparaisse jamais — seule l'annotation générique de pnpm/GitHub
      # était visible. Un simple `|| true` réglerait ce cas mais en ouvrirait
      # un autre : il avalerait AUSSI un fichier annoncé suivi d'une erreur
      # sans rapport avec le réseau (bug après écriture) — le code réel est
      # donc capturé dans `code` et revérifié juste après le premier `if`.
      - name: Scraping Bringo (Casablanca)
        id: scraping
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-bringo bringo-categories.txt Casablanca | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::error::scraper-bringo n'a annoncé aucun fichier d'archive (ligne \"→ Archive : ...\" absente des logs) — run marqué en échec."
            pnpm --filter pipeline run enregistrer-echec-scraping bringo injoignable || true
            exit 1
          fi

          # Un fichier a été annoncé, mais le processus s'est quand même
          # terminé en erreur APRÈS coup (bug sans rapport avec le réseau,
          # exception non rattrapée, etc.) — `code` ne peut être non-nul ici
          # que si `pnpm` a échoué malgré la ligne "→ Archive :" imprimée.
          # Ignorer cette archive potentiellement incomplète par précaution,
          # plutôt que de la traiter comme un run propre.
          if [ "$code" -ne 0 ]; then
            echo "::error::scraper-bringo a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, run marqué en échec."
            pnpm --filter pipeline run enregistrer-echec-scraping bringo injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::error::Fichier annoncé par scraper-bringo introuvable sur disque : $fichier"
            pnpm --filter pipeline run enregistrer-echec-scraping bringo injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::error::0 deal extrait par scraper-bringo — run marqué en échec (rien à insérer)."
            pnpm --filter pipeline run enregistrer-echec-scraping bringo rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      # Capture RESUME_JSON (émis par insert-deals.mjs, qui écrit déjà la
      # ligne pipeline_runs correspondante) pour que l'annotation du run
      # reflète la cause réelle — jamais un succès muet qui masquerait
      # "rien retenu" ou "tout déjà en base" derrière une étape verte.
      - name: Insertion en base (validation zod partagée)
        env:
          FICHIER_EXTRACTION: ${{ steps.scraping.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::Bringo — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::Bringo — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire inwi (lot du 23/07/2026) — même pattern de capture/
      # vérification que l'étape Bringo ci-dessus, avec deux divergences
      # voulues : continue-on-error (un échec inwi ne fait jamais échouer le
      # run Bringo déjà accompli — cf. exception documentée en tête de
      # fichier) et ::warning:: au lieu de ::error:: (0 deal inwi = page promo
      # vide ce jour-là, plausible pour une petite page d'offres — signal à
      # surveiller, pas un incident). Prérequis prod : l'enseigne `inwi` doit
      # exister en base (docs/RUNBOOK-donnees.md) — sinon insert-deals rejette
      # proprement chaque deal (enseigne inconnue), sans erreur.
      - name: Scraping inwi (Offres du moment)
        id: scraping_inwi
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-inwi | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-inwi n'a annoncé aucun fichier d'archive — source inwi sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping inwi injoignable || true
            exit 1
          fi

          # Fichier annoncé, mais processus terminé en erreur après coup —
          # archive potentiellement incomplète, ignorée par précaution.
          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-inwi a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source inwi sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping inwi injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-inwi introuvable sur disque : $fichier — source inwi sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping inwi injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals inwi extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-inwi — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping inwi rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion inwi en base (validation zod partagée)
        if: steps.scraping_inwi.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_INWI: ${{ steps.scraping_inwi.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_INWI" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::inwi — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::inwi — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire universparadiscount (lot du 23/07/2026) — pattern
      # strictement identique à inwi ci-dessus : continue-on-error (échec
      # isolé, ne casse ni Bringo ni inwi ni la revalidation), ::warning:: au
      # lieu de ::error:: (0 deal = homepage sans remise ce jour-là, plausible
      # — signal à surveiller, pas un incident). Prérequis prod : l'enseigne
      # `universparadiscount` doit exister en base (docs/RUNBOOK-donnees.md) —
      # sinon insert-deals rejette proprement chaque deal (enseigne inconnue),
      # sans erreur.
      - name: Scraping universparadiscount (homepage, remisés)
        id: scraping_upd
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-universparadiscount | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-universparadiscount n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping universparadiscount injoignable || true
            exit 1
          fi

          # Fichier annoncé, mais processus terminé en erreur après coup —
          # archive potentiellement incomplète, ignorée par précaution.
          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-universparadiscount a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping universparadiscount injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-universparadiscount introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping universparadiscount injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals universparadiscount extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-universparadiscount — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping universparadiscount rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion universparadiscount en base (validation zod partagée)
        if: steps.scraping_upd.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_UPD: ${{ steps.scraping_upd.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_UPD" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::universparadiscount — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::universparadiscount — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire lemobilier.ma (Maison — docs/SPIKE-SOURCES.md,
      # recontrôle du 14/08/2026, ORANGE -> VERT). Même pattern que les
      # sources ci-dessus. Pas de plafond posé (contrairement à kiabi) : le
      # scraper lit lui-même le total réel de la page promo et le récupère
      # en une seule requête (voir scraper-lemobilier.mjs pour le détail de
      # cette mesure, `?page=N` étant ignoré par ce thème). Prérequis prod :
      # l'enseigne `lemobilier` doit exister en base
      # (docs/RUNBOOK-donnees.md, `ajouter-enseigne`) — sinon insert-deals
      # rejette proprement chaque deal (enseigne inconnue).
      - name: Scraping lemobilier.ma (page promo)
        id: scraping_lemobilier
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-lemobilier | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-lemobilier n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping lemobilier injoignable || true
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-lemobilier a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping lemobilier injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-lemobilier introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping lemobilier injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals lemobilier extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-lemobilier — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping lemobilier rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion lemobilier.ma en base (validation zod partagée)
        if: steps.scraping_lemobilier.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_LEMOBILIER: ${{ steps.scraping_lemobilier.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_LEMOBILIER" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::lemobilier — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::lemobilier — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire kiabi (lot du 02/08/2026) — même pattern que les
      # trois ci-dessus. Particularité de cette source : ~45 % du catalogue est
      # remisé en permanence (mesuré : 556 deals sur 1250 produits au premier
      # dry-run), donc le scraper se cape lui-même à 120 deals/run pour ne pas
      # ensevelir la file admin auto_draft — un 0 deal ici serait donc anormal,
      # contrairement à decathlon. Prérequis prod : enseigne `kiabi` en base
      # (ajoutée le 02/08/2026, cf. docs/RUNBOOK-donnees.md).
      - name: Scraping kiabi (catalogue Shopify products.json)
        id: scraping_kiabi
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-kiabi | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-kiabi n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping kiabi injoignable || true
            exit 1
          fi

          # Fichier annoncé, mais processus terminé en erreur après coup —
          # archive potentiellement incomplète, ignorée par précaution.
          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-kiabi a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping kiabi injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-kiabi introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping kiabi injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals kiabi extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-kiabi — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping kiabi rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion kiabi en base (validation zod partagée)
        if: steps.scraping_kiabi.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_KIABI: ${{ steps.scraping_kiabi.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_KIABI" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::kiabi — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::kiabi — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire carrefour.ma (docs/SPIKE-SOURCES.md §10-12) — même
      # pattern que kiabi ci-dessus. EN PARALLÈLE de bringo, PAS EN
      # REMPLACEMENT (décision du 13/08/2026) : bringo reste la première
      # source en volume, l'API carrefour.ma vient d'apparaître, sa
      # stabilité n'est pas prouvée. Les deux tournent sous la MÊME enseigne
      # ("Carrefour", déjà en base — aucun ajout d'enseigne requis) pour que
      # le dédoublonnage titre+enseigne+prix d'insert-deals.mjs s'applique
      # sans amendement entre les deux sources.
      - name: Scraping carrefour.ma (API JSON)
        id: scraping_carrefour
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-carrefour | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-carrefour n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping carrefour injoignable || true
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-carrefour a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping carrefour injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-carrefour introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping carrefour injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals carrefour extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-carrefour — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping carrefour rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion carrefour.ma en base (validation zod partagée)
        if: steps.scraping_carrefour.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_CARREFOUR: ${{ steps.scraping_carrefour.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_CARREFOUR" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::carrefour — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::carrefour — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire ab-maroc.com (Store API WooCommerce, mono-domaine
      # Bricolage & Jardin — docs/SPIKE-SOURCES.md §9). RÉINTÉGRÉE le
      # 15/08/2026 après un retrait de quelques heures, revenu sur décision :
      # l'échec `fetch failed` du run du 15/08 (05:29) était un incident
      # isolé (aucun statut HTTP, jamais reproduit au diagnostic dédié la
      # même journée — docs/IDEES.md), et le site a produit 79 deals la
      # veille. Le mécanisme de séries d'échecs consécutifs
      # (verification-sources ci-dessous) existe précisément pour ce cas —
      # un incident unique ne justifie pas un retrait, seule une série le
      # justifierait. Prérequis prod : l'enseigne `ab-maroc` doit exister en
      # base (docs/RUNBOOK-donnees.md, `ajouter-enseigne`) — sinon
      # insert-deals rejette proprement chaque deal (enseigne inconnue).
      - name: Scraping ab-maroc.com (Store API WooCommerce)
        id: scraping_abmaroc
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-ab-maroc | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-ab-maroc n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping ab-maroc injoignable || true
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-ab-maroc a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping ab-maroc injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-ab-maroc introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping ab-maroc injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals ab-maroc extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-ab-maroc — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping ab-maroc rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion ab-maroc.com en base (validation zod partagée)
        if: steps.scraping_abmaroc.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_ABMAROC: ${{ steps.scraping_abmaroc.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_ABMAROC" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::ab-maroc — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::ab-maroc — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      # Source secondaire aswakassalam.com (Store API WooCommerce,
      # catégorisation par rayon — docs/SPIKE-SOURCES.md §9). Seule vraie
      # piste Alimentaire du dépôt (0 deal publié à ce jour). Même pattern
      # que les sources ci-dessus. Prérequis prod : l'enseigne
      # `aswakassalam` doit exister en base (docs/RUNBOOK-donnees.md,
      # `ajouter-enseigne`) — sinon insert-deals rejette proprement chaque
      # deal (enseigne inconnue).
      - name: Scraping aswakassalam.com (Store API WooCommerce)
        id: scraping_aswak
        continue-on-error: true
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run scraper-aswakassalam | tee /dev/stderr) && code=0 || code=$?

          fichier_relatif=$(printf '%s\n' "$sortie" | sed -n 's/^→ Archive : //p' | tail -n1)
          if [ -z "$fichier_relatif" ]; then
            echo "::warning::scraper-aswakassalam n'a annoncé aucun fichier d'archive — source sautée pour ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping aswakassalam injoignable || true
            exit 1
          fi

          if [ "$code" -ne 0 ]; then
            echo "::warning::scraper-aswakassalam a annoncé un fichier d'archive MAIS le processus s'est terminé en erreur (code $code) — archive ignorée par précaution, source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping aswakassalam injoignable || true
            exit 1
          fi

          fichier="apps/pipeline/$fichier_relatif"
          if [ ! -f "$fichier" ]; then
            echo "::warning::Fichier annoncé par scraper-aswakassalam introuvable sur disque : $fichier — source sautée."
            pnpm --filter pipeline run enregistrer-echec-scraping aswakassalam injoignable || true
            exit 1
          fi

          nb_deals=$(jq 'length' "$fichier")
          echo "Deals aswakassalam extraits : $nb_deals"
          if [ "$nb_deals" -eq 0 ]; then
            echo "::warning::0 deal extrait par scraper-aswakassalam — rien à insérer pour cette source ce run."
            pnpm --filter pipeline run enregistrer-echec-scraping aswakassalam rien_retenu || true
            exit 1
          fi

          echo "fichier=$fichier_relatif" >> "$GITHUB_OUTPUT"

      - name: Insertion aswakassalam.com en base (validation zod partagée)
        if: steps.scraping_aswak.outcome == 'success'
        continue-on-error: true
        env:
          FICHIER_EXTRACTION_ASWAK: ${{ steps.scraping_aswak.outputs.fichier }}
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run insert-deals "$FICHIER_EXTRACTION_ASWAK" | tee /dev/stderr)
          resume=$(printf '%s\n' "$sortie" | sed -n 's/^RESUME_JSON=//p' | tail -n1)
          cause=$(printf '%s' "$resume" | jq -r '.cause // empty')
          if [ "$cause" = "rien_retenu" ]; then
            echo "::warning::aswakassalam — aucun deal retenu après filtrage sur ce run : $resume"
          elif [ "$cause" = "deja_en_base" ]; then
            echo "::warning::aswakassalam — tout ce qui a été retenu était déjà en base sur ce run : $resume"
          fi

      - name: Revalidation Next.js (feed, enseignes, sitemap)
        run: |
          curl -sf -X POST "https://fidwastafid.com/api/revalidate" \
            -H "x-revalidate-token: ${{ secrets.REVALIDATE_TOKEN }}"

      # Préserve l'acquis d'archivage (dossiers horodatés) sans rien stocker
      # dans le repo — artefact du run, pas un commit. `if: always()` :
      # archiver ce qui a été produit même si une étape suivante échoue.
      - name: Archive des extractions du jour
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extractions-${{ github.run_id }}
          path: apps/pipeline/extractions/
          retention-days: 30
          if-no-files-found: ignore

      # Même raison que pour le backup (fait générateur du 27/07/2026, cf.
      # db-backup.yml) : la note en tête de ce fichier disait « GitHub notifie
      # par email, suffisant à cette échelle » — c'est faux pour un run de cron,
      # qui n'a pas d'auteur de commit à notifier. La chaîne principale échouait
      # donc en silence. Mécanique d'issue partagée avec le backup
      # (.github/actions/alerte-issue).
      - name: Alerte — échec du pipeline
        if: failure()
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-pipeline
          depot: ${{ github.repository }}
          titre: "Pipeline quotidien en échec"
          corps: |
            Le workflow **Pipeline quotidien** a **échoué**.

            | | |
            |---|---|
            | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Déclencheur | `${{ github.event_name }}` |

            La chaîne principale (expiration → Bringo → insertion → revalidation) est
            sans `continue-on-error` : l'échec vient de l'une de ces étapes. Les sources
            secondaires (inwi, universparadiscount, kiabi, carrefour, ab-maroc,
            aswakassalam, lemobilier) ne peuvent pas faire échouer le run — leurs
            incidents se lisent en annotations `::warning::`.

            Cause déjà rencontrée : le secret `SUPABASE_DB_URL` périmé après une rotation
            du mot de passe de la base (il alimente **aussi** ce workflow, pas seulement le
            backup) — voir `docs/RUNBOOK-securite.md`, section « Rotation du mot de passe
            de la base ».

  # ----------------------------------------------------------------------
  # SURVEILLANCE CROISÉE — le cas « aucune exécution » (voir la justification
  # complète en tête du job équivalent dans db-backup.yml). Ici c'est le
  # pipeline qui veille sur le backup ; là-bas, l'inverse.
  # ----------------------------------------------------------------------
  surveillance-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Fraîcheur du dernier succès du backup quotidien
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          SEUIL_HEURES: ${{ inputs.seuil_heures || 30 }}
        run: |
          set -euo pipefail

          DERNIER=$(gh run list -R "$DEPOT" --workflow db-backup.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')

          if [ -z "$DERNIER" ]; then
            echo "alerte=oui" >> "$GITHUB_OUTPUT"
            echo "detail=aucun run réussi trouvé dans l'historique consultable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$(( ( $(date -u +%s) - $(date -u -d "$DERNIER" +%s) ) / 3600 ))
          echo "Dernier succès du backup : $DERNIER (il y a ${AGE} h, seuil ${SEUIL_HEURES} h)"

          if [ "$AGE" -gt "$SEUIL_HEURES" ]; then
            echo "alerte=oui" >> "$GITHUB_OUTPUT"
            echo "detail=dernier succès il y a ${AGE} h (seuil ${SEUIL_HEURES} h), le ${DERNIER}" >> "$GITHUB_OUTPUT"
          else
            echo "alerte=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Alerte — le backup quotidien ne tourne plus
        if: steps.fraicheur.outputs.alerte == 'oui'
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-backup
          depot: ${{ github.repository }}
          titre: "Backup de la base : aucune exécution récente"
          corps: |
            Le workflow **Backup base de données** n'a **pas tourné** dans la fenêtre attendue.

            | | |
            |---|---|
            | Constat | ${{ steps.fraicheur.outputs.detail }} |
            | Vu depuis | run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) du pipeline |

            **Tant que cette issue est ouverte, la production n'a pas de backup vérifié
            récent.** Ce cas ne produit aucun échec à observer : c'est une **absence**,
            détectée par surveillance croisée.

            À vérifier dans l'ordre : le workflow est-il encore `active` (GitHub désactive
            un workflow planifié après 60 jours d'inactivité du dépôt) ? Le cron a-t-il été
            supprimé ou modifié ?

  # ----------------------------------------------------------------------
  # SUPERVISION DES SOURCES (lot du 12/08/2026) — lit pipeline_runs (écrite
  # par insert-deals.mjs et enregistrer-echec-scraping.mjs ci-dessus),
  # calcule la série de runs consécutifs en échec par (source, cause), et
  # sort une ligne ALERTE=<json> par source qui dépasse le seuil de SA
  # cause. `if: always()` : tourne même si le job `pipeline` a échoué —
  # certaines sources secondaires ont pu écrire des lignes avant l'échec
  # d'une autre étape.
  # ----------------------------------------------------------------------
  verification-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: pipeline
    if: always()
    outputs:
      alertes: ${{ steps.verifier.outputs.alertes }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Détecte les sources en série d'échecs
        id: verifier
        env:
          # LISTE UNIQUE, tenue ICI et nulle part ailleurs — même fichier
          # que les étapes de scraping ci-dessus (job `pipeline`), pour
          # qu'ajouter/retirer une source sans mettre à jour cette ligne
          # soit visible dans le MÊME diff de PR. Valeur = exactement ce que
          # sourceDepuisFichier() lit dans chaque nom d'archive
          # (extractions/AAAA-MM-JJ_HH-mm_<source>.json) — PAS le nom du
          # script npm : bringo est un cas à part, source
          # "bringo-<ville>" (ici "bringo-casablanca", cf. l'argument
          # "Casablanca" de l'étape "Scraping Bringo" ci-dessus), toutes les
          # autres sources partagent leur nom avec leur script scraper-*.
          SOURCES_ATTENDUES: >-
            bringo-casablanca,inwi,universparadiscount,kiabi,
            carrefour,ab-maroc,aswakassalam,lemobilier
        run: |
          set -o pipefail
          sortie=$(pnpm --filter pipeline run verifier-sources-mortes | tee /dev/stderr)
          alertes=$(printf '%s\n' "$sortie" | sed -n 's/^ALERTE=//p' | jq -s -c '.')
          echo "Sources en alerte : $(printf '%s' "$alertes" | jq 'length')"
          echo "alertes=$alertes" >> "$GITHUB_OUTPUT"

  # Un job séparé, avec une matrice dynamique construite depuis la sortie du
  # précédent : la seule façon d'appeler .github/actions/alerte-issue une
  # fois PAR SOURCE en alerte, sans dupliquer sa logique de dédoublonnage —
  # réutilise le MÊME mécanisme que alerte-pipeline/alerte-backup ci-dessus,
  # un label par source (alerte-source-<source>) pour que chacune se referme
  # indépendamment des autres.
  alerte-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verification-sources
    if: needs.verification-sources.outputs.alertes != '[]'
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        alerte: ${{ fromJson(needs.verification-sources.outputs.alertes) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      # "jamais_vue" (14/08/2026) : pas une série d'échecs (0 run, pas N),
      # gabarit distinct — "0 runs consécutifs" serait un non-sens pour
      # l'opérateur qui lit l'issue. Même action, mêmes champs matrix,
      # seuls titre/corps divergent selon la cause.
      - name: Alerte — source en série d'échecs
        if: matrix.alerte.cause != 'jamais_vue'
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-source-${{ matrix.alerte.source }}
          depot: ${{ github.repository }}
          titre: "Source ${{ matrix.alerte.source }} : ${{ matrix.alerte.serie }} runs consécutifs en échec (${{ matrix.alerte.cause }})"
          corps: |
            La source **${{ matrix.alerte.source }}** enchaîne **${{ matrix.alerte.serie }} run(s)**
            avec la cause `${{ matrix.alerte.cause }}` (seuil de cette cause : ${{ matrix.alerte.seuil }}).

            | | |
            |---|---|
            | Cause | `${{ matrix.alerte.cause }}` — voir `packages/db/migrations/0020_pipeline_runs.sql` pour le détail des trois causes |
            | Série actuelle | ${{ matrix.alerte.serie }} run(s) consécutif(s) |
            | Seuil de cette cause | ${{ matrix.alerte.seuil }} |
            | Vu depuis | run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Historique complet (base de production) :
            ```sql
            select * from pipeline_runs where source = '${{ matrix.alerte.source }}' order by cree_le desc limit 20;
            ```

            Cette issue se referme manuellement une fois la cause traitée — un nouveau run
            'ok' pour cette source ne la referme pas automatiquement, il remet seulement la
            série à zéro pour les prochaines vérifications.

      - name: Alerte — source attendue jamais vue en base
        if: matrix.alerte.cause == 'jamais_vue'
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-source-${{ matrix.alerte.source }}
          depot: ${{ github.repository }}
          titre: "Source ${{ matrix.alerte.source }} : listée dans SOURCES_ATTENDUES mais AUCUNE ligne dans pipeline_runs"
          corps: |
            La source **${{ matrix.alerte.source }}** est listée dans `SOURCES_ATTENDUES`
            (job `verification-sources`, `pipeline-quotidien.yml`) mais n'a **jamais** écrit
            de ligne dans `pipeline_runs` — ni succès, ni échec. Un scraper qui n'est
            simplement jamais appelé ne déclenche aucune des alertes de série ci-dessus,
            construites pour détecter un ÉCHEC, pas une ABSENCE (fait générateur du
            14/08/2026 : `scraper-carrefour.mjs`, fusionné et déployé, jamais câblé au cron).

            | | |
            |---|---|
            | Vu depuis | run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            À vérifier : l'étape de scraping de cette source existe-t-elle bien dans le job
            `pipeline` de `pipeline-quotidien.yml` ? Son nom de source (suffixe du fichier
            d'archive, `extractions/AAAA-MM-JJ_HH-mm_<source>.json`) correspond-il
            exactement à la valeur dans `SOURCES_ATTENDUES` ?

            Cette issue se referme manuellement une fois la source réellement câblée et son
            premier run réel visible dans `pipeline_runs`.
