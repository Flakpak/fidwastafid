# .github/workflows/purge-images.yml
#
# Purge d'images de deals supprimés (lot 4, plan « suppression administrative
# des deals ») — le seul geste irréversible de tout le dispositif, construit
# désarmé.
#
# PAS DE `schedule:` ICI, volontairement, contrairement à db-backup.yml et
# pipeline-quotidien.yml : ce job ne doit jamais tourner tout seul tant que
# l'activation n'a pas été une décision EXPLICITE et NOMMÉE (consigne de
# conception du lot). `workflow_dispatch` uniquement — chaque exécution, y
# compris en mode à blanc, est un geste volontaire.
#
# `actif` reste FAUX par défaut sur ce déclenchement manuel lui-même : lancer
# le workflow sans le cocher rapporte ce qui serait supprimé, n'écrit rien
# (apps/pipeline/purger-images.mjs). C'est aussi le moyen de produire le
# rapport « qu'est-ce qui serait supprimé aujourd'hui » demandé à la
# conception : Run workflow avec delai_jours=0, actif décoché.

name: Purge des images de deals supprimés

on:
  workflow_dispatch:
    inputs:
      actif:
        description: "Active réellement la purge (Storage + journal_audit). Décoché = mode à blanc, ne fait que rapporter."
        type: boolean
        default: false
      delai_jours:
        description: "Délai en jours après supprime_le (90 par défaut). Mettre 0 pour simuler « aujourd'hui »."
        type: string
        required: false

permissions:
  contents: read
  issues: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PURGE_IMAGES_ACTIF: ${{ inputs.actif && 'true' || 'false' }}
      PURGE_IMAGES_DELAI_JOURS: ${{ inputs.delai_jours }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Purge des images (ou simulation)
        run: pnpm --filter pipeline run purger-images

      # Même raison que db-backup.yml/pipeline-quotidien.yml : un run de cron
      # (ou ici, de déclenchement manuel non surveillé) n'a pas d'auteur de
      # commit à qui GitHub enverrait un e-mail d'échec. Un job de purge muet
      # qui échoue laisserait croire au nettoyage — mécanique d'alerte
      # réutilisée telle quelle, jamais dupliquée.
      - name: Alerte — échec de la purge d'images
        if: failure()
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-purge-images
          depot: ${{ github.repository }}
          assignes: Flakpak
          labels-supplementaires: urgent
          titre: "Purge d'images en échec"
          corps: |
            Le workflow **Purge des images de deals supprimés** a **échoué**.

            | | |
            |---|---|
            | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Mode | `actif=${{ inputs.actif }}`, `delai_jours=${{ inputs.delai_jours || '90 (défaut)' }}` |

            Si `actif` était vrai : des fichiers ont pu être effacés du Storage AVANT
            l'échec — `apps/pipeline/purger-images.mjs` traite les candidats un par un et
            pose `image_purgee_le` immédiatement après chaque suppression réussie ; un run
            interrompu ne laisse donc jamais un `image_purgee_le` posé sans suppression
            réelle correspondante, mais peut laisser un lot partiellement traité. Relancer
            le workflow reprend là où il s'est arrêté (la requête de candidats exclut déjà
            `image_purgee_le is not null`).

            Si `actif` était faux (mode à blanc) : aucune écriture n'a pu avoir eu lieu,
            l'échec porte uniquement sur le rapport lui-même (connexion base, Storage
            injoignable pour la taille des fichiers, etc.).
