# .github/workflows/purge-lignes.yml
#
# Purge automatique des lignes (lot 5, plan « suppression administrative des
# deals ») — EN SUPPRESSION DOUCE, jamais un DELETE réel. Réversible par
# construction (POST .../restaurer, lot 1), contrairement à purge-images.yml.
#
# `schedule:` AJOUTÉ le 05/08/2026 (armement du mode à blanc, PAS de la
# purge) : même doctrine que purge-images.yml — hebdomadaire, rapporte sans
# jamais écrire, `actif` structurellement impossible hors `workflow_dispatch`
# (condition explicite ci-dessous, pas seulement l'absence implicite de
# `inputs` sur `schedule`). Objectif : voir l'écart entre 0 et un nombre non
# nul de lignes candidates AVANT toute décision d'armement.

name: Purge automatique des lignes (suppression douce)

on:
  schedule:
    # Dimanche 04:30 UTC — juste après purge-images.yml (04:00), décalé pour
    # ne pas partager exactement la même minute. Toujours à blanc, délai réel
    # (60 jours par défaut).
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      actif:
        description: "Active réellement la suppression douce (+ journal_audit). Décoché = mode à blanc, ne fait que rapporter. Sans effet hors workflow_dispatch."
        type: boolean
        default: false
      delai_jours:
        description: "Dormance minimale en jours depuis created_at (60 par défaut). Mettre 0 pour simuler « aujourd'hui »."
        type: string
        required: false

permissions:
  contents: read
  issues: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      PURGE_LIGNES_ACTIF: ${{ github.event_name == 'workflow_dispatch' && inputs.actif && 'true' || 'false' }}
      PURGE_LIGNES_DELAI_JOURS: ${{ inputs.delai_jours }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tee` double le rapport dans le résumé du run — même motif que
      # purge-images.yml : visibilité du passage hebdomadaire à blanc, pas un
      # nouveau canal d'alerte.
      - name: Purge des lignes (ou simulation)
        run: pnpm --filter pipeline run purger-lignes | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Alerte — échec de la purge de lignes (ou de son rapport à blanc)
        if: failure()
        uses: ./.github/actions/alerte-issue
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          label: alerte-purge-lignes
          depot: ${{ github.repository }}
          assignes: Flakpak
          labels-supplementaires: urgent
          titre: "Purge automatique des lignes (ou son rapport à blanc) en échec"
          corps: |
            Le workflow **Purge automatique des lignes (suppression douce)** a **échoué**.

            | | |
            |---|---|
            | Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Déclencheur | `${{ github.event_name }}` |
            | Mode | `actif=${{ env.PURGE_LIGNES_ACTIF }}`, `delai_jours=${{ inputs.delai_jours || '60 (défaut)' }}` |

            Action réversible (suppression DOUCE, `deals.supprime_le`) : contrairement à la purge
            d'images, un run interrompu ici ne perd rien — chaque ligne déjà marquée reste
            restaurable (`POST .../restaurer`). L'UPDATE porte sa propre garde
            (`supprime_le is null`) : relancer le workflow ne re-traite jamais une ligne déjà
            marquée. Un rapport à blanc (y compris le passage hebdomadaire automatique) qui
            plante ne prouve rien sur ce qu'il aurait dû annoncer — traité comme tout autre échec.
