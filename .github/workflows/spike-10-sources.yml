# Spike jetable — jamais destiné à être fusionné sur main.
# Joignabilité depuis un runner GitHub + signaux de structure pour les
# candidats ayant passé le filtre robots.txt. C'est le point qui a fait
# tomber bestmark et decathlon, invisible depuis un réseau normal.
name: Spike 10 sources (jetable)
on:
  workflow_dispatch:
  push:
    branches: [ops/spike-10-sources]
    paths: [.github/workflows/spike-10-sources.yml]
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch + signaux structure pour chaque candidat
        run: |
          cat > /tmp/spike.mjs <<'SPIKE_EOF'
          const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";

          const cibles = [
            { nom: "marjanemall.ma", url: "https://www.marjanemall.ma/" },
            { nom: "marjanemall.ma/promotions", url: "https://www.marjanemall.ma/promotions" },
            { nom: "ab-maroc.com", url: "https://ab-maroc.com/" },
            { nom: "biougnach.ma", url: "https://www.biougnach.ma/" },
            { nom: "beautymall.ma", url: "https://www.beautymall.ma/" },
            { nom: "lemobilier.ma", url: "https://lemobilier.ma/" },
            { nom: "aswakassalam.com", url: "https://aswakassalam.com/" },
          ];

          function analyse(html) {
            const del = (html.match(/<del/gi) || []).length;
            const ins = (html.match(/<ins/gi) || []).length;
            const jsonLd = (html.match(/application\/ld\+json/gi) || []).length;
            const jsonLdOffer = (html.match(/"@type"\s*:\s*"Offer"/gi) || []).length;
            const priceClass = (html.match(/class="[^"]*price[^"]*"/gi) || []).length;
            const appRoot = /<app-root|ng-version|data-reactroot|__NEXT_DATA__|id="app"[^>]*>\s*<\/div>/i.test(html);
            const promoWord = (html.match(/promo|solde|r[ée]duction|remise/gi) || []).length;
            return { len: html.length, del, ins, jsonLd, jsonLdOffer, priceClass, appRoot, promoWord };
          }

          for (const { nom, url } of cibles) {
            try {
              const r = await fetch(url, { headers: { "User-Agent": ua } });
              const t = await r.text();
              const a = analyse(t);
              console.log(
                nom, "|", url, "| STATUS", r.status,
                "| LEN", a.len,
                "| <del>", a.del, "| <ins>", a.ins,
                "| JSON-LD", a.jsonLd, "(Offer:", a.jsonLdOffer + ")",
                "| class*=price", a.priceClass,
                "| indices SPA/CSR (app-root/next/react)", a.appRoot,
                "| mots promo/solde/reduction", a.promoWord
              );
            } catch (e) {
              console.log(nom, "|", url, "| FETCH FAILED:", e.message);
            }
          }

          console.log("=== ANALYSE FINE : beautymall.ma et aswakassalam.com ===");
          for (const url of ["https://www.beautymall.ma/", "https://aswakassalam.com/"]) {
            const r = await fetch(url, { headers: { "User-Agent": ua } });
            const t = await r.text();
            console.log("---", url, "---");
            console.log("Titre :", (t.match(/<title>([^<]*)<\/title>/i) || [])[1]);
            console.log("Plateforme (générateur meta) :", (t.match(/generator" content="([^"]*)"/i) || [])[1] || "non trouvé");
            console.log("WooCommerce present:", /woocommerce/i.test(t), "| PrestaShop present:", /prestashop/i.test(t), "| Magento present:", /magento|Mage\./i.test(t), "| Shopify present:", /Shopify|cdn\.shopify/i.test(t));

            const paires = [...t.matchAll(/<del[^>]*>([\s\S]{0,150}?)<\/del>[\s\S]{0,300}?<ins[^>]*>([\s\S]{0,150}?)<\/ins>/gi)];
            console.log("Paires del/ins trouvees (fenetre large) :", paires.length);
            const amountRe = /([\d]{1,3}(?:[\s.,]\d{3})*(?:[.,]\d{1,2})?)\s*(?:DH|MAD|Dhs?)/i;
            let ok = 0, remises = [];
            for (const p of paires.slice(0, 40)) {
              const reg = p[1].replace(/<[^>]*>/g, " ").match(amountRe);
              const promo = p[2].replace(/<[^>]*>/g, " ").match(amountRe);
              if (reg && promo) {
                const toNum = (s) => parseFloat(s.replace(/\s/g, "").replace(/\.(?=\d{3})/g, "").replace(",", "."));
                const r1 = toNum(reg[1]), p1 = toNum(promo[1]);
                if (r1 > 0 && p1 > 0 && p1 < r1) { ok++; remises.push((((r1 - p1) / r1) * 100).toFixed(1)); }
              }
            }
            console.log("Appariements reussis (sur 40 max testes) :", ok, "| remises % :", remises.join(", "));
            if (paires.length > 0) {
              console.log("--- Exemple brut (1 paire) ---");
              console.log(paires[0][0].slice(0, 500));
            }
          }
          SPIKE_EOF
          node /tmp/spike.mjs
