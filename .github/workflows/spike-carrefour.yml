# Spike jetable — jamais destiné à être fusionné sur main.
# carrefour.ma : joignabilité depuis un runner GitHub (c'est ce qui a tué
# bestmark/decathlon/marjanemall.ma, invisible depuis un réseau normal),
# ampleur du catalogue face à bringo.ma (2 rayons aujourd'hui), et
# recherche d'une page promo/soldes.
name: Spike carrefour.ma (jetable)
on:
  workflow_dispatch:
  push:
    branches: [ops/spike-carrefour]
    paths: [.github/workflows/spike-carrefour.yml]
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reachability + structure + rayons
        run: |
          cat > /tmp/spike.mjs <<'SPIKE_EOF'
          const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";

          async function fetchPage(url) {
            const r = await fetch(url, { headers: { "User-Agent": ua } });
            return { status: r.status, html: await r.text() };
          }

          console.log("=== ROBOTS.TXT ===");
          {
            const { status, html } = await fetchPage("https://carrefour.ma/robots.txt");
            console.log("STATUS", status);
            console.log(html.slice(0, 500));
          }

          console.log("=== ACCUEIL (sans www) ===");
          const home = await fetchPage("https://carrefour.ma/");
          console.log("STATUS", home.status, "LEN", home.html.length);
          console.log("Cloudflare challenge:", home.html.includes("Just a moment") || home.html.includes("Attention Required"));
          console.log("Titre:", (home.html.match(/<title>([^<]*)<\/title>/i) || [])[1]);

          console.log("=== www.carrefour.ma (DNS KO depuis ce reseau, a verifier ici) ===");
          try {
            const www = await fetchPage("https://www.carrefour.ma/");
            console.log("STATUS", www.status, "LEN", www.html.length);
          } catch (e) {
            console.log("FETCH FAILED:", e.message);
          }

          console.log("=== LIENS DE NAVIGATION (rayons/categories) ===");
          const navLinks = [...new Set([...home.html.matchAll(/href="(\/[a-z0-9\-\/]+)"[^>]*>([^<]{2,60})</gi)]
            .map(m => m[1] + " | " + m[2].trim())
            .filter(s => !s.includes("|  ") && s.length < 100))];
          console.log("Nombre de liens internes distincts avec texte :", navLinks.length);
          console.log(navLinks.slice(0, 80).join("\n"));

          console.log("=== RECHERCHE MOTS-CLES RAYONS DANS LE HTML BRUT ===");
          const motsCles = ["high-tech", "high tech", "informatique", "gaming", "jeux", "bricolage", "jardin", "jouet", "electromenager", "électroménager", "promo", "solde"];
          for (const mot of motsCles) {
            const n = (home.html.toLowerCase().match(new RegExp(mot.toLowerCase(), "g")) || []).length;
            console.log(mot, ":", n);
          }

          console.log("=== SITEMAP ===");
          try {
            const sm = await fetchPage("https://carrefour.ma/sitemap.xml");
            console.log("STATUS", sm.status, "LEN", sm.html.length);
            if (sm.status === 200) console.log(sm.html.slice(0, 1000));
          } catch (e) {
            console.log("FETCH FAILED:", e.message);
          }
          SPIKE_EOF
          node /tmp/spike.mjs
