# Spike jetable — jamais destiné à être fusionné sur main.
# Suite du spike mgamesstore.com (Gaming) : volume réel dans la grille
# principale (exclut le widget sidebar "top rated"), snapshot pour
# comparaison de renouvellement à 48h.
name: Spike mgamesstore suite (jetable)
on:
  workflow_dispatch:
  push:
    branches: [ops/spike-mgamesstore-suite]
    paths: [.github/workflows/spike-mgamesstore-2.yml]
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch + analyse grille principale + pagination + snapshot
        run: |
          cat > /tmp/spike3.mjs <<'SPIKE_EOF'
          const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
          const base = "https://mgamesstore.com/product-category/jeux-video/promotion/";

          async function fetchPage(url) {
            const r = await fetch(url, { headers: { "User-Agent": ua } });
            return { status: r.status, html: await r.text() };
          }

          function grillePrincipale(html) {
            const start = html.indexOf('data-source="main_loop"');
            if (start < 0) return null;
            // La grille se termine au footer de pagination qui suit.
            const end = html.indexOf('wd-loop-footer', start);
            return html.slice(start, end > 0 ? end : start + 60000);
          }

          function analysePage(html) {
            const grille = grillePrincipale(html);
            if (!grille) return { produits: 0, remises: [] };
            const liens = [...new Set([...grille.matchAll(/href="(https:\/\/mgamesstore\.com\/product\/[a-z0-9-]+\/)"/gi)].map(m => m[1]))];
            const paires = [...grille.matchAll(/<del aria-hidden="true"><span class="woocommerce-Price-amount amount"><bdi>([\d.,]+)<span[^>]*>[^<]*<\/span><\/bdi><\/span><\/del>[\s\S]{0,200}?<ins aria-hidden="true"><span class="woocommerce-Price-amount amount"><bdi>([\d.,]+)<span/gi)];
            const remises = paires.map(p => {
              const reg = parseFloat(p[1].replace(/\./g, "").replace(",", "."));
              const promo = parseFloat(p[2].replace(/\./g, "").replace(",", "."));
              return reg > 0 && promo > 0 && promo < reg ? ((reg - promo) / reg) * 100 : null;
            }).filter(x => x !== null);
            return { produits: liens.length, remises, liens };
          }

          let tousLiens = [];
          let toutesRemises = [];
          for (let n = 1; n <= 4; n++) {
            const url = n === 1 ? base : base + "page/" + n + "/";
            const { status, html } = await fetchPage(url);
            if (status !== 200) { console.log("Page", n, "status", status, "- fin pagination"); break; }
            const { produits, remises, liens } = analysePage(html);
            console.log("Page", n, ": grille principale =", produits, "produits, paires del/ins appariées =", remises.length);
            if (produits === 0 && n > 1) break;
            tousLiens.push(...(liens || []));
            toutesRemises.push(...remises);
          }

          const au30 = toutesRemises.filter(r => r >= 30).length;
          const sous30 = toutesRemises.filter(r => r < 30).length;
          console.log("TOTAL produits remisés (grille principale, toutes pages) :", tousLiens.length);
          console.log("TOTAL remises appariées avec succès :", toutesRemises.length);
          console.log("Détail des remises (%) :", toutesRemises.map(r => r.toFixed(1)).join(", "));
          console.log("BILAN >= 30% :", au30, "| < 30% :", sous30);

          console.log("--- SNAPSHOT", new Date().toISOString(), "---");
          console.log("SNAPSHOT_LIENS=" + JSON.stringify([...new Set(tousLiens)].sort()));
          SPIKE_EOF
          node /tmp/spike3.mjs
