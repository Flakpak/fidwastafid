# Spike jetable — jamais destiné à être fusionné sur main.
# Vérifie mgamesstore.com (candidat Gaming) depuis un vrai runner GitHub,
# pas seulement depuis un autre réseau — c'est ce qui a fait tomber
# bestmark et decathlon. Aucune écriture en base, aucune insertion.
name: Spike mgamesstore (jetable)
on:
  workflow_dispatch:
  push:
    branches: [ops/seuils-decathlon-voyages]
    paths: [.github/workflows/spike-mgamesstore.yml]
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch + analyse
        run: |
          cat > /tmp/spike.mjs <<'SPIKE_EOF'
          const ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36";
          const url = "https://mgamesstore.com/product-category/jeux-video/promotion/";
          const r = await fetch(url, { headers: { "User-Agent": ua } });
          const t = await r.text();
          console.log("STATUS", r.status, "LEN", t.length);
          console.log("Cloudflare challenge:", t.includes("Just a moment") || t.includes("Attention Required"));

          const liEls = [...t.matchAll(/<li[^>]*class="[^"]*product[^"]*"[\s\S]*?<\/li>/gi)];
          console.log("cartes li.product trouvees :", liEls.length);

          const candidats = ["woocommerce-loop-product__title", "onsale", "woocommerce-Price-amount", "<del", "<ins", "wp-post-image", "attachment-woocommerce_thumbnail", "product-title", "product_title"];
          for (const c of candidats) {
            const n = t.split(c).length - 1;
            console.log("occurrences de", c, ":", n);
          }

          const cartes = [...t.matchAll(/<li class="product /gi)];
          console.log("vraies cartes produit (class=\"product \") :", cartes.length);
          if (cartes.length > 0) {
            const start = cartes[0].index;
            console.log("--- PREMIERE VRAIE CARTE (brut, 3000 car) ---");
            console.log(t.slice(start, start + 3000));
          }

          const amountRe = />([\d\s.,]+)\s*(?:DH|MAD|Dhs?)/i;
          const paires = [...t.matchAll(/<del>[\s\S]*?<\/del>\s*<ins>[\s\S]*?<\/ins>/gi)];
          console.log("paires del/ins strictement adjacentes :", paires.length);
          let sous30 = 0, au30 = 0;
          for (const p of paires) {
            const delTxt = p[0].match(/<del>([\s\S]*?)<\/del>/i)[1];
            const insTxt = p[0].match(/<ins>([\s\S]*?)<\/ins>/i)[1];
            const reg = delTxt.match(amountRe);
            const promo = insTxt.match(amountRe);
            if (reg && promo) {
              const r1 = parseFloat(reg[1].replace(/\s/g, "").replace(",", "."));
              const p1 = parseFloat(promo[1].replace(/\s/g, "").replace(",", "."));
              if (r1 > 0 && p1 > 0 && p1 < r1) {
                const pct = ((r1 - p1) / r1) * 100;
                console.log("remise:", pct.toFixed(1), "% (", r1, "->", p1, ")");
                if (pct >= 30) au30++; else sous30++;
              }
            }
          }
          console.log("BILAN remise >= 30% :", au30, "| remise < 30% :", sous30);
          SPIKE_EOF
          node /tmp/spike.mjs
