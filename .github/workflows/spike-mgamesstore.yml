# Spike jetable — jamais destiné à être fusionné sur main.
# Vérifie mgamesstore.com (candidat Gaming) depuis un vrai runner GitHub,
# pas seulement depuis un autre réseau — c'est ce qui a fait tomber
# bestmark et decathlon. Aucune écriture en base, aucune insertion.
name: Spike mgamesstore (jetable)
on:
  workflow_dispatch:
  push:
    branches: [ops/seuils-decathlon-voyages]
    paths: [.github/workflows/spike-mgamesstore.yml]
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch + analyse
        run: |
          node -e "
          async function main() {
            const ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
            const url = 'https://mgamesstore.com/product-category/jeux-video/promotion/';
            const r = await fetch(url, { headers: { 'User-Agent': ua } });
            const t = await r.text();
            console.log('STATUS', r.status, 'LEN', t.length);
            console.log('Cloudflare challenge:', t.includes('Just a moment') || t.includes('Attention Required'));

            const liEls = [...t.matchAll(/<li[^>]*class=\"[^\"]*product[^\"]*\"[\s\S]*?<\/li>/gi)];
            console.log('cartes <li class=product...> trouvées :', liEls.length);

            for (const cand of ['woocommerce-loop-product__title','onsale','woocommerce-Price-amount','<del','<ins','wp-post-image','attachment-woocommerce_thumbnail']) {
              const n = (t.match(new RegExp(cand.replace(/[.*+?^\${}()|[\]\\]/g, '\\\\\$&'), 'gi')) || []).length;
              console.log('occurrences de', cand, ':', n);
            }

            if (liEls.length > 0) {
              console.log('--- PREMIERE CARTE PRODUIT (brut, 2500 car max) ---');
              console.log(liEls[0][0].slice(0, 2500));
            } else {
              const idx = t.indexOf('woocommerce-Price-amount');
              console.log('--- FRAGMENT AUTOUR DU PREMIER PRIX (brut) ---');
              console.log(idx >= 0 ? t.slice(Math.max(0, idx - 800), idx + 800) : 'introuvable');
            }
          }
          main().catch(e => console.log('FETCH FAILED:', e.message));
          "
